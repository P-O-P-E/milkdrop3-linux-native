name: Release package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git ninja-build pkg-config \
            libgl1-mesa-dev mesa-common-dev libsdl2-dev libsdl2-image-dev libglm-dev
      - name: Build local libprojectM
        run: |
          git clone --branch v4.1.7 --depth 1 --recurse-submodules \
            https://github.com/projectM-visualizer/projectm.git build/projectm-src
          cmake -S build/projectm-src -B build/projectm-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/projectm-install" \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DENABLE_INSTALL=ON \
            -DENABLE_PLAYLIST=OFF \
            -DENABLE_SDL_UI=OFF \
            -DENABLE_SYSTEM_PROJECTM_EVAL=OFF
          cmake --build build/projectm-build --parallel
          cmake --install build/projectm-build
      - name: Build application
        run: |
          cmake -S . -B build/package -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/projectm-install" \
            -DCMAKE_INSTALL_RPATH="$GITHUB_WORKSPACE/build/projectm-install/lib"
          cmake --build build/package --parallel
          ctest --test-dir build/package --output-on-failure
      - name: Create packages
        working-directory: build/package
        run: cpack -G TGZ
      - uses: actions/upload-artifact@v7
        with:
          name: milkdrop3-linux-packages
          path: build/package/milkdrop3-linux-native-*.tar.gz
