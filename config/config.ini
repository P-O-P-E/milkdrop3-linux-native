# Copy to ~/.config/milkdrop3-linux/config.ini and edit as needed.
# Paths beginning with ~, $HOME, or ${HOME} are expanded.

# Repeat preset_dir and texture_dir to add multiple search paths.
preset_dir=${HOME}/.local/share/milkdrop3-linux/presets
texture_dir=${HOME}/.local/share/milkdrop3-linux/textures

# Use "default", an index from --list-audio-devices, or part of a device name.
# PipeWire/PulseAudio monitor sources capture the desktop audio mix.
audio_device=default

width=1280
height=720
fps=60
fullscreen=false
vsync=true

mesh_width=96
mesh_height=54
preset_duration=30
transition_duration=3
shuffle=true
recursive=true

beat_sensitivity=1.0
hard_cuts=true
hard_cut_duration=10
hard_cut_sensitivity=1.0

